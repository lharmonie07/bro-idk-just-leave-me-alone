name: Start Decryptor

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AES_TEXT_KEY_HEX: ${{ secrets.AES_TEXT_KEY_HEX }}
          AES_TEXT_IV_HEX: ${{ secrets.AES_TEXT_IV_HEX }}
          AES_ARCHIVE_KEY_HEX: ${{ secrets.AES_ARCHIVE_KEY_HEX }}
          AES_ARCHIVE_IV_HEX: ${{ secrets.AES_ARCHIVE_IV_HEX }}
        run: |
          echo "Bot is starting..."
          python bot.py
